<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Irizée">
  <!--
    Le « i » d'irizee-logo.png, relevé au pixel sur le canal alpha plutôt
    que redessiné à vue : point de rayon 113 centré en x=133,5 ; fût de 208
    de large ; attaque diagonale en haut à gauche qui part de x=29 à y=342
    pour rejoindre x=228 à y=272 ; pied évasé sur les quarante derniers
    pixels. Le glyphe source mesure 258 × 829, d'où l'échelle 0,41.

    Tracé en formes vectorielles et non en rognage du PNG : à 16 px, un
    bout d'image se brouille, un contour reste net.
  -->
  <rect width="512" height="512" rx="112" fill="#1A1A1A"/>
  <g transform="translate(203 86) scale(0.41)" fill="#FFFFFF">
    <circle cx="133.5" cy="113" r="113"/>
    <path d="M228 272
             C235 273 237 278 237 285
             L237 787
             C237 801 244 813 253 818
             C258 821 256 828 250 828
             L21 828
             C15 828 13 821 18 818
             C27 813 34 801 34 787
             L34 350
             L30 344
             C95 316 165 288 228 272 Z"/>
  </g>
</svg>
