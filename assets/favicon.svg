<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Irizée">
  <!--
    Le « i » du logo : un point rond nettement plus large que le fût, c'est
    ce qui signe la typographie d'Irizée. Dessiné plutôt que rogné dans le
    PNG : à 16 px, un bout d'image se brouille, des formes géométriques non.
  -->
  <rect width="100" height="100" rx="22" fill="#1A1A1A"/>
  <circle cx="50" cy="31" r="12" fill="#FFFFFF"/>
  <rect x="41" y="49" width="18" height="28" rx="4" fill="#FFFFFF"/>
</svg>
